<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pirate Captain — 3D Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1218; color: #e6c892; font-family: Georgia, serif; overflow: hidden; }
    #c { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute; left: 16px; top: 16px; z-index: 2;
      background: rgba(8,20,28,0.82); border: 1px solid rgba(224,177,69,0.45);
      border-radius: 8px; padding: 12px 16px; max-width: 320px;
    }
    h1 { margin: 0 0 6px; font-size: 1.25rem; color: #e0b145; }
    p { margin: 0; font-size: 0.9rem; opacity: 0.9; line-height: 1.4; }
    .status { margin-top: 8px; font-size: 0.8rem; opacity: 0.7; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="hud">
    <h1>Pirate Captain</h1>
    <p>Drag to orbit · scroll to zoom</p>
    <p class="status" id="status">Loading model…</p>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1218);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(0.6, 1.0, 2.2);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 0.7, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xfff0dd, 1.2);
    key.position.set(2, 4, 3);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88aacc, 0.45);
    fill.position.set(-3, 1, -2);
    scene.add(fill);
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.5, 48),
      new THREE.MeshStandardMaterial({ color: 0x142029, roughness: 0.9, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const loader = new GLTFLoader();
    loader.load(
      'models3d/pirate_captain.glb',
      (gltf) => {
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale = 1.6 / Math.max(size.x, size.y, size.z);
        root.scale.setScalar(scale);
        root.position.sub(center.multiplyScalar(scale));
        root.position.y -= box.min.y * scale;
        scene.add(root);
        controls.target.set(0, size.y * scale * 0.45, 0);
        status.textContent = 'Ready — models3d/pirate_captain.glb';
      },
      (e) => { status.textContent = `Loading ${Math.round((e.loaded / e.total) * 100) || 0}%`; },
      (err) => { status.textContent = 'Failed to load GLB'; console.error(err); }
    );

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function tick() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
